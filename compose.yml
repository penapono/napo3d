name: napo3d

x-api-environment: &api-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-napo3d}:${POSTGRES_PASSWORD:-napo3d}@db:5432/${POSTGRES_DB:-napo3d_development}
  HOST: 0.0.0.0
  PORT: "3001"
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  FROM_EMAIL: ${FROM_EMAIL:-}
  ORDER_RECIPIENT: ${ORDER_RECIPIENT:-pedro.gnaponoceno@gmail.com}
  MAKERWORLD_SCRAPER_URL: ${MAKERWORLD_SCRAPER_URL:-http://makerworld-scraper:8010}
  MAKERWORLD_SCRAPE_INTERVAL_MS: ${MAKERWORLD_SCRAPE_INTERVAL_MS:-60000}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1/responses}
  OPENAI_PRODUCT_ENRICHMENT_MODEL: ${OPENAI_PRODUCT_ENRICHMENT_MODEL:-gpt-4o-mini}
  AI_PRODUCT_ENRICHMENT_INTERVAL_MS: ${AI_PRODUCT_ENRICHMENT_INTERVAL_MS:-0}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-napo3d_development}
      POSTGRES_USER: ${POSTGRES_USER:-napo3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-napo3d}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-napo3d} -d ${POSTGRES_DB:-napo3d_development}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - napo3d_postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    command: ["node", "--watch", "./server/index.js"]
    environment:
      <<: *api-environment
    depends_on:
      db:
        condition: service_healthy
      makerworld-scraper:
        condition: service_started
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./server:/app/server:ro
      - ./shared:/app/shared:ro
      - ./data:/app/data:ro

  makerworld-scraper:
    build:
      context: .
      dockerfile: Dockerfile.makerworld
    restart: unless-stopped
    volumes:
      - ./makerworld_scraper:/app/makerworld_scraper:ro

  front:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./admin.html:/usr/share/nginx/html/admin.html:ro
      - ./robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./shared:/usr/share/nginx/html/shared:ro
      - ./data:/usr/share/nginx/html/data:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  napo3d_postgres:
