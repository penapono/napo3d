name: napo3d-production

x-api-environment: &api-environment
  DATABASE_URL: ${DATABASE_URL}
  HOST: 0.0.0.0
  PORT: "3001"
  CORS_ORIGINS: ${CORS_ORIGINS}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER}
  RESEND_API_KEY: ${RESEND_API_KEY}
  FROM_EMAIL: ${FROM_EMAIL}
  ORDER_RECIPIENT: ${ORDER_RECIPIENT}
  MAKERWORLD_SCRAPER_URL: ${MAKERWORLD_SCRAPER_URL:-http://makerworld-scraper:8010}
  MAKERWORLD_SCRAPE_INTERVAL_MS: ${MAKERWORLD_SCRAPE_INTERVAL_MS:-60000}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1/responses}
  OPENAI_PRODUCT_ENRICHMENT_MODEL: ${OPENAI_PRODUCT_ENRICHMENT_MODEL:-gpt-4o-mini}
  AI_PRODUCT_ENRICHMENT_INTERVAL_MS: ${AI_PRODUCT_ENRICHMENT_INTERVAL_MS:-0}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *api-environment
    networks:
      - corus
    depends_on:
      makerworld-scraper:
        condition: service_started
    ports:
      - "127.0.0.1:3501:3001"

  makerworld-scraper:
    build:
      context: .
      dockerfile: Dockerfile.makerworld
    restart: unless-stopped
    networks:
      - corus

  front:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3500:3000"

networks:
  corus:
    external: true
    name: corus
